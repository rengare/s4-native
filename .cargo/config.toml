# Hook-phase DLLs are loaded into the original 32-bit game.
[build]
target = "i686-pc-windows-gnu"

[target.i686-pc-windows-gnu]
linker = "i686-w64-mingw32-gcc"
# DllMain is exported undecorated; the stdcall fixup is expected.
rustflags = ["-C", "link-arg=-Wl,--enable-stdcall-fixup", "-C", "link-arg=-Wl,--stack,67108864"]
