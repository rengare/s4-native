[workspace]
resolver = "3"
members = ["s4/dllexport", "s4/difftest", "s4/x87", "s4/x86", "s4/host", "s4/gpu", "s4/x86test", "s4/lifted/*", "s4/play", "s3/lifted/*", "s3/play", "tools/gfxdump", "tools/lift", "tools/wsprobe"]
# The generated game crates and the front end build for the host; the older hook-phase DLLs target i686 Windows.
default-members = ["s4/dllexport", "s4/difftest", "s4/x87", "s4/x86", "tools/gfxdump", "tools/wsprobe"]

[profile.release]
opt-level = 2

# Generated code compiles much faster (and is still fast enough) at opt-level 1.
[profile.release.package.lifted-ir50]
opt-level = 1

[profile.release.package.lifted-s3main]
opt-level = 1

[profile.release.package.lifted-gfxengine]
opt-level = 1

# The parts of S3.EXE (tools/lift_s3.sh): rustc runs one per core, so few code generation units each (memory).
[profile.release.package.lifted-s3main-p00]
opt-level = 1
codegen-units = 1

